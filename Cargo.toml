[workspace]
resolver = "3"
members = ["crates/hench", "crates/hench-macros", "crates/hench-web", "crates/hench-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/rkwap/hench"
authors = ["Ramit Koul"]
keywords = ["background-jobs", "job-queue", "redis", "sidekiq", "async"]
categories = ["asynchronous", "concurrency", "web-programming"]

[workspace.dependencies]
hench = { path = "crates/hench", version = "0.1.0" }
# `=`: the expansion of `#[hench::job]` uses `hench::__private`, so each hench release works
# with its own hench-macros only (released together; see docs/RELEASING.md).
hench-macros = { path = "crates/hench-macros", version = "=0.1.0" }
hench-web = { path = "crates/hench-web", version = "0.1.0" }

tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
redis = { version = "1.8", default-features = false, features = ["aio", "tokio-comp", "connection-manager", "script"] }
# Only used to give the rustls inside redis (TLS) a crypto provider and TLS 1.2 support.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1.0.220", features = ["derive"] }
# float_roundtrip: floats in job arguments must parse back to the exact same value.
serde_json = { version = "1.0.140", features = ["float_roundtrip"] }
thiserror = "2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json", "fmt"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
getrandom = "0.4"
fastrand = "2.3"
flate2 = "1.1"
base64 = "0.23"
inventory = "0.3.20"
hostname = "0.4"
# Only for the SIGTSTP constant (quiet signal) on Unix.
libc = "0.2.170"
futures = "0.3.31"
anyhow = "1.0.98"
async-trait = "0.1.89"

syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"

axum = { version = "0.8.4", features = ["form", "query", "json", "tokio", "http1"] }
# hench-server serves its connections itself: `axum::serve` sets no timer, so hyper applies no
# request-head timeout, and it has no connection limit (both already built for axum).
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1", "service"] }
askama = "0.16"
tower = { version = "0.5.2", features = ["util"] }
http = "1.3"
http-body-util = "0.1.3"
clap = { version = "4.5", features = ["derive", "env"] }
toml = "1"
# hench-web and hench-server: constant-time comparison of CSRF tokens and credentials, and
# URL encoding of links, forms and query strings.
subtle = "2.6"
percent-encoding = "2.3"
form_urlencoded = "1.2"
# hench-web: identifies a queue's job by the SHA-1 of its JSON in delete forms (already built
# for redis-rs's scripts).
sha1_smol = "1.0"
# hench: unique-job digests, periodic definition digests and long limiter keys (one hash for
# every digest: `hench::canonical`).
sha2 = "0.10"
# hench's `periodic` feature: cron expressions (behind a private wrapper) and IANA time zones
# (the system database first, a bundled copy otherwise; never the host's local zone).
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
jiff = { version = "0.2.35", default-features = false, features = ["std", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-always"] }

tempfile = "3.20"
proptest = "1.7"
trybuild = "1.0.105"
scraper = "0.29"

# Line tables keep file:line in backtraces while cutting build output (and
# disk use, which matters when several worktrees build in parallel) roughly
# in half.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
