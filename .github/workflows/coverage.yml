name: Coverage

# Every push to `main` (which refreshes the README's badge) and every pull request is measured,
# while the repository is public: there GitHub Actions minutes are free and unlimited, while on
# a private repository they would use the account's monthly minutes, so the job skips itself.
# It can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the running measurement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Reads the repository; `id-token` lets the Codecov upload log in with GitHub's OIDC token, so
# no Codecov token is stored as a secret.
permissions:
  contents: read
  id-token: write

# Third-party actions are pinned to full commit SHAs (a tag can be moved), the version in a
# comment.

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Redis
        # The integration tests start private redis-server processes (hench::test_util).
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 180 apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              && sudo timeout 300 apt-get install -y --no-install-recommends redis-server; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done
          redis-server --version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Measure
        # The whole test suite, every feature; the library code counts, not the tests, the
        # examples or the benchmark programs.
        timeout-minutes: 40
        run: >-
          cargo llvm-cov --workspace --all-features
          --ignore-filename-regex '(^|/)(tests|examples|benches|benchmarks)/'
          --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          files: lcov.info
          disable_search: true
          # GitHub gives pull requests from forks no OIDC token; Codecov accepts their
          # uploads without one for public repositories.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # A Codecov outage fails a run started by hand, not a contributor's pull request.
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}
